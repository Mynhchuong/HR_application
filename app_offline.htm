<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Maintenance / Đang bảo trì</title>
<style>
  body { margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh;
         background:#f8fafc; font-family:sans-serif; }
  .box { text-align:center; padding:40px; }
  .box img { width:220px; margin-bottom:16px; }
  h2 { color:#1e40af; margin:0 0 8px; }
  p  { color:#64748b; margin:0; }

  /* === BATTLE ANIMATIONS === */
  @keyframes screenShake {
    0%,100%{transform:translate(0,0)}
    10%{transform:translate(-5px,-3px)}
    20%{transform:translate(5px,-2px)}
    30%{transform:translate(-4px,5px)}
    40%{transform:translate(4px,2px)}
    50%{transform:translate(-2px,-5px)}
    60%{transform:translate(2px,4px)}
    70%{transform:translate(-5px,2px)}
    80%{transform:translate(5px,-2px)}
    90%{transform:translate(-2px,-3px)}
  }
  @keyframes auraGlow {
    0%,100%{filter:drop-shadow(0 0 6px #ff6b00) drop-shadow(0 0 18px #cc0000) brightness(1.05)}
    50%{filter:drop-shadow(0 0 22px #ff9500) drop-shadow(0 0 44px #ff4500) brightness(1.15)}
  }
  @keyframes fireRise {
    0%{transform:translateX(var(--dx)) translateY(0) scale(1);opacity:1}
    100%{transform:translateX(calc(var(--dx) + var(--drift))) translateY(-90px) scale(0.1);opacity:0}
  }
  @keyframes explode {
    0%{transform:scale(0);opacity:1}
    55%{transform:scale(2.2);opacity:0.8}
    100%{transform:scale(4);opacity:0}
  }
  @keyframes spark {
    0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(var(--sx),var(--sy)) scale(0);opacity:0}
  }
  @keyframes lightning {
    0%,100%,30%,60%{opacity:0;transform:scaleX(1)}
    15%{opacity:1;transform:scaleX(1.5)}
    45%{opacity:0.7;transform:scaleX(0.8)}
  }
  .battle-wrap{
    position:relative;
    display:inline-block;
    animation:screenShake 0.35s linear infinite;
  }
  .battle-wrap img{
    display:block;
    width:220px;
    animation:auraGlow 0.6s ease-in-out infinite;
  }
  .fx{position:absolute;pointer-events:none;border-radius:50%}
  .fx-fire{
    background:radial-gradient(circle,#fff 0%,#ffee00 25%,#ff6600 55%,transparent 100%);
    animation:fireRise var(--dur,0.7s) ease-out var(--delay,0s) infinite;
  }
  .fx-exp{
    background:radial-gradient(circle,#fff 0%,#ffff00 20%,#ff6600 55%,transparent 100%);
    animation:explode var(--dur,0.5s) ease-out var(--delay,0s) infinite;
  }
  .fx-spark{
    width:5px;height:5px;
    background:#ffdd00;
    box-shadow:0 0 4px #ff9900;
    animation:spark var(--dur,0.4s) ease-out var(--delay,0s) infinite;
  }
  .fx-bolt{
    position:absolute;
    pointer-events:none;
    width:3px;
    background:linear-gradient(to bottom,transparent,#aaeeff 20%,#ffffff 50%,#aaeeff 80%,transparent);
    border-radius:2px;
    animation:lightning 0.18s ease-in-out var(--delay,0s) infinite;
    opacity:0;
  }
</style>
</head>

    {l:130, t:60,  sz:30, dur:'0.5s',  delay:'0.3s'},
    {l:50,  t:70,  sz:18, dur:'0.42s', delay:'0.22s'},
  ];
  exps.forEach(function(e){
    fx('fx-exp', {
      left:e.l+'px', top:e.t+'px',
      width:e.sz+'px', height:e.sz+'px',
      '--dur': e.dur, '--delay': e.delay
    });
  });

  // Sparks
  var sparks = [
    {l:100, t:60, sx:'-30px', sy:'-40px', delay:'0s'},
    {l:110, t:55, sx:'25px',  sy:'-50px', delay:'0.07s'},
    {l:95,  t:70, sx:'-20px', sy:'30px',  delay:'0.14s'},
    {l:120, t:65, sx:'35px',  sy:'20px',  delay:'0.21s'},
    {l:105, t:45, sx:'-15px', sy:'-60px', delay:'0.05s'},
    {l:115, t:75, sx:'20px',  sy:'40px',  delay:'0.28s'},
    {l:85,  t:50, sx:'-40px', sy:'-20px', delay:'0.12s'},
    {l:130, t:45, sx:'30px',  sy:'-35px', delay:'0.19s'},
  ];
  sparks.forEach(function(s){
    fx('fx-spark', {
      left:s.l+'px', top:s.t+'px',
      '--sx': s.sx, '--sy': s.sy,
      '--dur': '0.4s', '--delay': s.delay
    });
  });

  // Lightning bolts — giữa 2 nhân vật
  var bolts = [
    {l:100, t:35, h:55, delay:'0s'},
    {l:112, t:25, h:70, delay:'0.06s'},
    {l:106, t:40, h:40, delay:'0.12s'},
    {l:118, t:30, h:60, delay:'0.09s'},
  ];
  bolts.forEach(function(b){
    var el = document.createElement('div');
    el.className = 'fx-bolt';
    el.style.cssText = 'left:'+b.l+'px;top:'+b.t+'px;height:'+b.h+'px;--delay:'+b.delay+';';
    wrap.appendChild(el);
  });
})();
</script>
</body>
</html>
